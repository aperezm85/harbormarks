services:
  db:
    image: postgres:17
    container_name: harbormarks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: harbormarks
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d harbormarks"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    image: ghcr.io/aperezm85/harbormarks:latest
    container_name: harbormarks-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://astro:astro@db:5432/harbormarks
      # Used only for first-start bootstrap when the users table is empty.
      HARBOR_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      HARBOR_BOOTSTRAP_ADMIN_NAME: Harbor Admin
      HARBOR_BOOTSTRAP_ADMIN_PASSWORD: use_a_long_unique_password
      # Public default is closed registration. Set to "true" only for a
      # private instance where you want self-service signup.
      HARBOR_ALLOW_SIGNUP: "false"
      HARBOR_CHECK_ORIGIN: "false"
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    # Stated explicitly rather than relying on the image CMD, so migrations cannot
    # be skipped by a stale container definition. Migrations run before the server
    # accepts requests; if one fails the container stops instead of serving against
    # a half-migrated database.
    command:
      ["sh", "-c", "node ./scripts/migrate.mjs && node ./dist/server/entry.mjs"]
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
