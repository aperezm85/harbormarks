name: Publish Docker image (GHCR)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Set up pnpm
       uses: pnpm/action-setup@v4

     - name: Set up Node
       uses: actions/setup-node@v4
       with:
          node-version: 22
          cache: pnpm

     - run: pnpm install --frozen-lockfile

     - run: pnpm lint

     - run: pnpm typecheck

     - run: pnpm test

  ghcr:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations and cache entries with GitHub OIDC
      packages: write # to push the image to GitHub Container Registry
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      file: ./dockerfile
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository_owner }}/harbormarks
      meta-tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=sha
        type=raw,value=latest,enable={{is_default_branch}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
